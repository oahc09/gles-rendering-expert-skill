name: GLES candidate validation (manual)
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  host-contracts:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      EGL_PLATFORM: surfaceless
      LIBGL_ALWAYS_SOFTWARE: '1'
      MESA_SHADER_CACHE_DISABLE: 'true'
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 0
      - name: Install host-only validation toolchain
        run: sudo apt-get update && sudo apt-get install -y g++ libegl-dev libgles-dev libegl-mesa0 glslang-tools
      - name: Structured rule contracts (not source compilation)
        run: python3 tools/validate_rules.py --output reports/rules.json
      - name: Actual GLSL compiler positive and negative controls
        run: python3 tools/validate_shaders.py --output reports/shaders.json
      - name: Actual C++17 and software EGL smoke
        env:
          EGL_PLATFORM: surfaceless
          LIBGL_ALWAYS_SOFTWARE: '1'
          MESA_SHADER_CACHE_DISABLE: 'true'
        run: sh examples/validation/run-host.sh
      - name: Legacy C++ example compile and link
        run: python3 examples/validation/compile-legacy.py
      - name: Research and GPU capture infrastructure (not hardware measurements)
        run: |
          python3 -m unittest discover -s references/research -p 'test_*.py' -v
          python3 -m unittest discover -s benchmarks/gpu -p 'test_*.py' -v
      - name: Agent benchmark infrastructure (not model-quality results)
        run: python3 -m unittest discover -s benchmarks/agent -p 'test_*.py' -v
      - name: Release gate infrastructure
        run: python3 -m unittest discover -s tools -p 'test_*.py' -v
      - name: Release gate remains separate
        run: python3 tools/check_release_gates.py
      - name: v1.0.4 software scene correctness (not mobile performance)
        run: |
          sh examples/scenes/run-host.sh S01 /tmp/scene-build-smoke.ppm 96 64 baseline
          python3 benchmarks/scenes/run.py --output reports/scenes --sweep
      - name: v1.0.4 lab/trace/Android source contracts (not APK/device acceptance)
        run: |
          python3 -m unittest discover -s benchmarks/scenes -p 'test_*.py' -v
          python3 -m unittest discover -s benchmarks/device_lab -p 'test_*.py' -v
          python3 -m unittest discover -s benchmarks/traces -p 'test_*.py' -v
          python3 -m unittest discover -s examples/android_cases -p 'test_*.py' -v
      - name: v1.0.4 actual controlled failure/fix reproduction (not model patches)
        run: python3 benchmarks/agent/reproduce_repairs.py --output reports/repair-reproduction.json
      - name: v1.0.4 candidate bookkeeping (release remains separately blocked)
        run: python3 tools/check_release_gates.py --gates v1.0.4
      - name: v1.0.5 policy, synthetic longrun and SQL infrastructure
        run: |
          python3 -m unittest discover -s benchmarks/quality_policy -p 'test_*.py' -v
          python3 -m unittest discover -s benchmarks/longrun -p 'test_*.py' -v
          python3 -m unittest discover -s benchmarks/traces/sql -p 'test_*.py' -v
          python3 -m unittest discover -s benchmarks/visual_quality -p 'test_*.py' -v
      - name: v1.0.5 real software resource stress (not Android loss)
        run: python3 benchmarks/resource_pressure/run.py --output reports/resource-pressure.json --scenes 100
      - name: v1.0.5 actual precision and visual regressions (not mobile performance)
        run: |
          sh examples/precision/run-host.sh P01 /tmp/precision-smoke.ppm 96 1 10000 baseline
          python3 benchmarks/visual_quality/run.py --output reports/visual-quality
      - name: v1.0.5 dependency-aware candidate bookkeeping
        run: python3 tools/check_release_gates.py --gates v1.0.5
      - name: v1.0.6 system candidate contracts (not target acceptance)
        run: |
          python3 -m unittest discover -s benchmarks/reducer -p 'test_*.py' -v
          python3 -m unittest discover -s benchmarks/system_scenes -p 'test_*.py' -v
          python3 -m unittest discover -s benchmarks/texture_pipeline -p 'test_*.py' -v
          python3 -m unittest discover -s benchmarks/driver_compat -p 'test_*.py' -v
          python3 benchmarks/reducer/reduce.py --output reports/reducer
          python3 tools/check_release_gates.py --gates v1.0.6
      - name: v1.0.7 schema and pipeline contracts (not device/model acceptance)
        run: |
          python3 -m pip install jsonschema==4.23.0
          python3 tools/validate_pipeline.py --output reports/pipeline-contracts.json
          python3 tools/audit_v107.py --output reports/v107-hygiene.json
          python3 -m unittest discover -s benchmarks/pipeline -p 'test_*.py' -v
          python3 benchmarks/pipeline/diagnose.py
          python3 benchmarks/pipeline/shader_experiments.py --output reports/shader-experiments.json
      - name: v1.0.7 actual software pipeline images and version routing
        run: |
          sh examples/pipeline/build.sh
          python3 benchmarks/pipeline/runtime.py --output reports/pipeline-runtime
          python3 benchmarks/pipeline/runtime.py --mesa-version-matrix --output reports/pipeline-versions
      - name: v1.0.7 recursive candidate gate (not release approval)
        run: python3 tools/check_release_gates.py --gates v1.0.7
