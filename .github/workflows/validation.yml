name: GLES candidate validation
on:
  workflow_dispatch:
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  host-contracts:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      EGL_PLATFORM: surfaceless
      LIBGL_ALWAYS_SOFTWARE: '1'
      MESA_SHADER_CACHE_DISABLE: 'true'
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 0
      - name: Restore packed data and explicitly fetch pinned public XML dependency
        run: python3 tools/coverage/materialize.py --fetch-public
      - name: Install host-only validation toolchain
        run: sudo apt-get update && sudo apt-get install -y g++ libegl-dev libgles-dev libegl-mesa0 glslang-tools libvulkan1
      - name: Structured rule contracts (not source compilation)
        run: python3 tools/validate_rules.py --output reports/rules.json
      - name: Actual GLSL compiler positive and negative controls
        run: python3 tools/validate_shaders.py --output reports/shaders.json
      - name: Actual C++17 and software EGL smoke
        env:
          EGL_PLATFORM: surfaceless
          LIBGL_ALWAYS_SOFTWARE: '1'
          MESA_SHADER_CACHE_DISABLE: 'true'
        run: sh examples/validation/run-host.sh
      - name: Legacy C++ example compile and link
        run: python3 examples/validation/compile-legacy.py
      - name: Research and GPU capture infrastructure (not hardware measurements)
        run: |
          python3 -m unittest discover -s references/research -p 'test_*.py' -v
          python3 -m unittest discover -s benchmarks/gpu -p 'test_*.py' -v
      - name: Agent benchmark infrastructure (not model-quality results)
        run: python3 -m unittest discover -s benchmarks/agent -p 'test_*.py' -v
      - name: Release gate infrastructure
        run: python3 -m unittest discover -s tools -p 'test_*.py' -v
      - name: Release gate remains separate
        run: python3 tools/check_release_gates.py
      - name: v1.0.4 software scene correctness (not mobile performance)
        run: |
          sh examples/scenes/run-host.sh S01 /tmp/scene-build-smoke.ppm 96 64 baseline
          python3 benchmarks/scenes/run.py --output reports/scenes --sweep
      - name: v1.0.4 lab/trace/Android source contracts (not APK/device acceptance)
        run: |
          python3 -m unittest discover -s benchmarks/scenes -p 'test_*.py' -v
          python3 -m unittest discover -s benchmarks/device_lab -p 'test_*.py' -v
          python3 -m unittest discover -s benchmarks/traces -p 'test_*.py' -v
          python3 -m unittest discover -s examples/android_cases -p 'test_*.py' -v
      - name: v1.0.4 actual controlled failure/fix reproduction (not model patches)
        run: python3 benchmarks/agent/reproduce_repairs.py --output reports/repair-reproduction.json
      - name: v1.0.4 candidate bookkeeping (release remains separately blocked)
        run: python3 tools/check_release_gates.py --gates v1.0.4
      - name: v1.0.5 policy, synthetic longrun and SQL infrastructure
        run: |
          python3 -m unittest discover -s benchmarks/quality_policy -p 'test_*.py' -v
          python3 -m unittest discover -s benchmarks/longrun -p 'test_*.py' -v
          python3 -m unittest discover -s benchmarks/traces/sql -p 'test_*.py' -v
          python3 -m unittest discover -s benchmarks/visual_quality -p 'test_*.py' -v
      - name: v1.0.5 real software resource stress (not Android loss)
        run: python3 benchmarks/resource_pressure/run.py --output reports/resource-pressure.json --scenes 100
      - name: v1.0.5 actual precision and visual regressions (not mobile performance)
        run: |
          sh examples/precision/run-host.sh P01 /tmp/precision-smoke.ppm 96 1 10000 baseline
          python3 benchmarks/visual_quality/run.py --output reports/visual-quality
      - name: v1.0.5 dependency-aware candidate bookkeeping
        run: python3 tools/check_release_gates.py --gates v1.0.5
      - name: v1.0.6 system candidate contracts (not target acceptance)
        run: |
          python3 -m unittest discover -s benchmarks/reducer -p 'test_*.py' -v
          python3 -m unittest discover -s benchmarks/system_scenes -p 'test_*.py' -v
          python3 -m unittest discover -s benchmarks/texture_pipeline -p 'test_*.py' -v
          python3 -m unittest discover -s benchmarks/driver_compat -p 'test_*.py' -v
          python3 benchmarks/reducer/reduce.py --output reports/reducer
          python3 tools/check_release_gates.py --gates v1.0.6
      - name: v1.0.7 schema and pipeline contracts (not device/model acceptance)
        run: |
          python3 -m pip install jsonschema==4.23.0
          python3 tools/validate_pipeline.py --output reports/pipeline-contracts.json
          python3 tools/audit_v107.py --output reports/v107-hygiene.json
          python3 -m unittest discover -s benchmarks/pipeline -p 'test_*.py' -v
          python3 benchmarks/pipeline/diagnose.py
          python3 benchmarks/pipeline/shader_experiments.py --output reports/shader-experiments.json
      - name: v1.0.7 actual software pipeline images and version routing
        run: |
          sh examples/pipeline/build.sh
          python3 benchmarks/pipeline/runtime.py --output reports/pipeline-runtime
          python3 benchmarks/pipeline/runtime.py --mesa-version-matrix --output reports/pipeline-versions
      - name: v1.0.7 recursive candidate gate (not release approval)
        run: python3 tools/check_release_gates.py --gates v1.0.7
      - name: v1.0.8 bounded recovery contracts (not release approval)
        run: |
          python3 -m unittest discover -s benchmarks/fuzz -p 'test_*.py' -v
          python3 -m unittest discover -s benchmarks/state_machine -p 'test_*.py' -v
          python3 -m unittest discover -s benchmarks/robustness -p 'test_*.py' -v
          python3 -m unittest discover -s benchmarks/pipeline/adversarial -p 'test_*.py' -v
          python3 -m unittest discover -s benchmarks/differential -p 'test_*.py' -v
          python3 -m unittest discover -s benchmarks/material_upgrade -p 'test_*.py' -v
          python3 -m unittest discover -s benchmarks/agent/v108 -p 'test_*.py' -v
          python3 benchmarks/material_upgrade/run.py --output reports/v108-film
          python3 tools/check_v108_gates.py
      - name: Provision pinned official ANGLE bundle
        run: |
          curl --fail --location --max-time 150 https://playwright.download.prss.microsoft.com/dbazure/download/playwright/builds/chromium/1194/chromium-headless-shell-linux.zip -o /tmp/angle.zip
          python3 benchmarks/differential/extract_locked.py /tmp/angle.zip /tmp/gles-angle
      - name: v1.0.8 locked dual-implementation acceptance
        run: python3 benchmarks/differential/ci.py --angle-root /tmp/gles-angle --output reports/v108-differential
      - name: v1.0.8 real bounded repair controls (not model scores)
        run: python3 benchmarks/agent/v108/run_host_controls.py --config reports/v108-differential/config.json --output reports/v108-repairs
      - name: v1.0.8 actual API source-repair controls
        run: python3 benchmarks/agent/v108/api_pipeline.py --config reports/v108-differential/config.json --output reports/v108-api-repairs
      - name: v1.0.8 actual fragment-image repair controls
        run: python3 benchmarks/agent/v108/image_pipeline.py --config reports/v108-repairs/implementations.json --output reports/v108-image-repairs
      - name: v1.0.9 workload optimization candidate contracts
        run: |
          python3 -m unittest discover -s benchmarks/workloads -p 'test_*.py' -v
          python3 -m unittest discover -s benchmarks/device_portability -p 'test_*.py' -v
          python3 -m unittest discover -s benchmarks/shader_ab -p 'test_*.py' -v
          python3 tools/check_v109_gates.py
          python3 tools/check_v109_scene_coverage.py
      - name: v1.0.9 actual software image controls (not device speedup)
        run: |
          echo '{"kind":"mesa","egl":"/usr/lib/x86_64-linux-gnu/libEGL.so.1","gles":"/usr/lib/x86_64-linux-gnu/libGLESv2.so.2"}' > /tmp/v109-mesa.json
          python3 benchmarks/shader_ab/run.py --config /tmp/v109-mesa.json --output reports/v109-shader-ab.json
          python3 benchmarks/texture_access/run.py --config /tmp/v109-mesa.json --output reports/v109-textures.json
      - name: v1.0.9 expanded actual dual-driver controls
        run: |
          python3 -m unittest discover -s benchmarks/attachment_controls -p 'test_*.py' -v
          python3 -m unittest discover -s benchmarks/hdr_controls -p 'test_*.py' -v
          python3 -m unittest discover -s benchmarks/overlap_scenes -p 'test_*.py' -v
          python3 -m unittest discover -s benchmarks/texture_access -p 'test_*.py' -v
          python3 tools/check_v109_evidence.py
          echo '{"kind":"angle","egl":"/tmp/gles-angle/libEGL.so","gles":"/tmp/gles-angle/libGLESv2.so","icd":"/tmp/gles-angle/vk_swiftshader_icd.json"}' > /tmp/v109-angle.json
          for driver in mesa angle; do
            python3 benchmarks/shader_ab/advanced.py --config /tmp/v109-$driver.json --output reports/v109-advanced-$driver.json
            python3 benchmarks/overlap_scenes/projected.py --config /tmp/v109-$driver.json --output reports/v109-projected-$driver.json
            python3 benchmarks/texture_access/mechanisms.py --config /tmp/v109-$driver.json --output reports/v109-texture-mechanisms-$driver.json
          done
      - name: Provision pinned official KTX tools for v1.0.9
        run: |
          curl --fail --location --max-time 150 https://github.com/KhronosGroup/KTX-Software/releases/download/v4.4.2/KTX-Software-4.4.2-Linux-x86_64.tar.bz2 -o /tmp/v109-ktx.tar.bz2
          echo 'a8781bad05f9624edbf910b7f258cd0a4ba7d3e63b49ecc0a0ab440bf6a0a245  /tmp/v109-ktx.tar.bz2' | sha256sum -c
          tar -xjf /tmp/v109-ktx.tar.bz2 -C /tmp
      - name: v1.0.9 covariance refraction and actual KTX transcode controls
        run: |
          for driver in mesa angle; do
            python3 benchmarks/system_scenes/v109_s03/run.py --config /tmp/v109-$driver.json --output reports/v109-s03-$driver.json
            python3 benchmarks/interleaved_capture/run.py --config /tmp/v109-$driver.json --output reports/v109-interleaved-$driver.json
            python3 benchmarks/shader_ab/optimization_pairs.py --config /tmp/v109-$driver.json --output reports/v109-optimization-pairs-$driver.json
            python3 benchmarks/texture_streaming/run.py --config /tmp/v109-$driver.json --output reports/v109-streaming-$driver.json
            python3 benchmarks/compressed_streaming/run.py --config /tmp/v109-$driver.json --ktx-root /tmp/KTX-Software-4.4.2-Linux-x86_64 --ktx-archive /tmp/v109-ktx.tar.bz2 --output reports/v109-compressed-streaming-$driver.json
            python3 benchmarks/workflow/run.py benchmarks/workflow/request.json --config /tmp/v109-$driver.json --backend $driver-software --output-dir reports/v109-workflow-$driver
            python3 benchmarks/overlap_scenes/coverage_scenes.py --config /tmp/v109-$driver.json --output reports/v109-coverage-scenes-$driver.json
            python3 benchmarks/texture_access/oblique.py --config /tmp/v109-$driver.json --output reports/v109-oblique-$driver.json
            python3 benchmarks/texture_streaming/progressive.py --config /tmp/v109-$driver.json --output reports/v109-progressive-$driver.json
            python3 benchmarks/device_portability/scene_collector.py collect --config /tmp/v109-$driver.json --backend $driver-software --output-dir reports/v109-scene-captures
            python3 benchmarks/pipeline/candidate_replay.py --config /tmp/v109-$driver.json --output reports/v109-graph-replay-$driver.json
            python3 benchmarks/shader_ab/rebind.py --config /tmp/v109-$driver.json --output reports/v109-rebind-$driver.json
            python3 benchmarks/particle_controls/run.py --config /tmp/v109-$driver.json --output reports/v109-particles-$driver.json
            python3 benchmarks/rollback_controls/run.py --config /tmp/v109-$driver.json --output reports/v109-rollback-$driver.json
            python3 benchmarks/shader_ab/packing.py --config /tmp/v109-$driver.json --output reports/v109-packing-$driver.json
            python3 benchmarks/attachment_controls/run.py --config /tmp/v109-$driver.json --output reports/v109-attachments-$driver.json
            python3 benchmarks/hdr_controls/run.py --config /tmp/v109-$driver.json --output reports/v109-hdr-$driver.json
            python3 benchmarks/overlap_scenes/advanced.py --config /tmp/v109-$driver.json --output reports/v109-overlap-advanced-$driver.json
            python3 benchmarks/pipeline/postfx_quality.py --config /tmp/v109-$driver.json --output reports/v109-postfx-$driver.json
            for pattern in smooth steep; do
              python3 benchmarks/texture_access/ktx2_experiment.py --config /tmp/v109-$driver.json --ktx-root /tmp/KTX-Software-4.4.2-Linux-x86_64 --pattern $pattern --output reports/v109-ktx-$driver-$pattern.json
            done
          done
      - name: v1.0.9 tier quality gate contract (not all-tier visual acceptance)
        run: |
          for driver in mesa angle; do
            python3 benchmarks/overlap_scenes/far_precision.py --config /tmp/v109-$driver.json --output reports/v109-far-precision-$driver.json --require-contract-only
            python3 benchmarks/overlap_scenes/far_adaptive_resolution.py --config /tmp/v109-$driver.json --output reports/v109-far-adaptive-$driver.json --require-contract-only
            python3 benchmarks/overlap_scenes/far_stage_probe.py --config /tmp/v109-$driver.json --output reports/v109-far-stage-$driver.json
            python3 benchmarks/overlap_scenes/far_reconstruction.py --config /tmp/v109-$driver.json --output reports/v109-far-reconstruction-$driver.json --require-contract-only
            python3 benchmarks/overlap_scenes/far_resolution.py --config /tmp/v109-$driver.json --output reports/v109-far-resolution-$driver.json --require-contract-only
            python3 benchmarks/overlap_scenes/background_merge.py --config /tmp/v109-$driver.json --output reports/v109-background-merge-$driver.json --require-contract-only
            python3 benchmarks/overlap_scenes/precision_replay.py --config /tmp/v109-$driver.json --output reports/v109-precision-admission-$driver.json
            python3 benchmarks/overlap_scenes/blend_precision.py --config /tmp/v109-$driver.json --output reports/v109-blend-precision-$driver.json --require-contract-only
            python3 benchmarks/overlap_scenes/tiered.py --config /tmp/v109-$driver.json --output reports/v109-tiered-$driver.json --require-harness-only
          done
      - name: v1.0.9 source chain and software scene grouping
        run: |
          python3 tools/check_v109_research_chain.py --output reports/v109-research-chain.json
          python3 tools/v109_research_index.py validate --source docs/v1.0.9/research/rolling/2026-11-15/radar.json.gz --source-receipt docs/v1.0.9/research/rolling/2026-11-15/receipt.json --index docs/v1.0.9/research/index.json.gz --report reports/v109-research-index.json
          python3 benchmarks/device_portability/scene_collector.py group reports/v109-scene-captures/mesa-software-record.json reports/v109-scene-captures/angle-software-record.json --artifact-root reports/v109-scene-captures --output reports/v109-scene-groups.json
      - name: v1.0.9 reproducible complete host unit manifest
        run: python3 tools/run_v109_regression.py --output reports/v109-unit-manifest.json
      - name: v1.1.0 frozen Registry offline and explicit rule links
        run: |
          python3 tools/coverage/verify_sources.py --output reports/v110-sources-offline.json
          python3 tools/coverage/check_coverage.py --root . --output reports/v110-coverage.json
          python3 tools/coverage/check_gates.py
      - name: v1.1.0 pinned upstream source verification (no baseline updates)
        run: python3 tools/coverage/verify_sources.py --online --output reports/v110-sources-online.json
      - name: v1.1.0 actual language and EGL lifecycle checks
        run: |
          python3 tools/coverage/verify_glsl.py --config /tmp/v109-mesa.json --output reports/v110-glsl-mesa.json
          python3 tools/coverage/verify_glsl.py --config /tmp/v109-angle.json --output reports/v110-glsl-angle.json --require-contract-only
          for driver in mesa angle; do
            python3 examples/closure/egl-lifecycle/run.py --config /tmp/v109-$driver.json --output reports/v110-egl-$driver.json
            python3 benchmarks/coverage/extensions/run_priority.py --config /tmp/v109-$driver.json --output reports/v110-priority-$driver.json
            python3 benchmarks/coverage/extensions/astc_decode.py --config /tmp/v109-$driver.json --output reports/v110-astc-decode-$driver.json
            python3 tools/coverage/multiview.py --config /tmp/v109-$driver.json --output reports/v110-multiview-$driver.json
            python3 benchmarks/coverage/robust-readback/run.py --config /tmp/v109-$driver.json --output reports/v110-robust-readback-$driver.json
            python3 benchmarks/coverage/pixel-local-storage/run.py --config /tmp/v109-$driver.json --output reports/v110-pls-$driver.json
            python3 benchmarks/coverage/skinning/run.py --config /tmp/v109-$driver.json --output reports/v110-skinning-$driver.json
            python3 benchmarks/coverage/distance-text/run.py --config /tmp/v109-$driver.json --output reports/v110-distance-text-$driver.json
            python3 benchmarks/coverage/weighted-oit/run.py --config /tmp/v109-$driver.json --output reports/v110-weighted-oit-$driver.json
            python3 benchmarks/coverage/distance-text/precision_probe.py --max-explicit-fetches 4 --config /tmp/v109-$driver.json --output reports/v110-distance-precision-$driver.json
            python3 benchmarks/coverage/weighted-oit/exact_replay.py --config /tmp/v109-$driver.json --output reports/v110-exact-order-$driver.json
            python3 benchmarks/coverage/depth-peeling/run.py --config /tmp/v109-$driver.json --output reports/v110-depth-peeling-$driver.json
            python3 benchmarks/coverage/transparency-routing/run.py --config /tmp/v109-$driver.json --output reports/v110-transparency-routing-$driver
            python3 benchmarks/coverage/debug-output/run.py --config /tmp/v109-$driver.json --output reports/v110-debug-output-$driver.json
            python3 benchmarks/coverage/debug-output/run.py --disable-debug --config /tmp/v109-$driver.json --output reports/v110-debug-disabled-$driver.json
            python3 benchmarks/coverage/timer-query/run.py --config /tmp/v109-$driver.json --output reports/v110-timer-query-$driver.json
            python3 benchmarks/coverage/timer-query/run.py --disable-timer --config /tmp/v109-$driver.json --output reports/v110-timer-disabled-$driver.json
            python3 benchmarks/coverage/external-image/run.py --config /tmp/v109-$driver.json --output reports/v110-external-image-$driver.json
            python3 benchmarks/coverage/external-image/run.py --disable-external --config /tmp/v109-$driver.json --output reports/v110-external-disabled-$driver.json
            python3 benchmarks/coverage/image-sync/run.py --config /tmp/v109-$driver.json --output reports/v110-image-sync-$driver.json
            python3 benchmarks/coverage/video-fusion/run.py --config /tmp/v109-$driver.json --output reports/v110-video-fusion-$driver.json
          done
          # ANGLE texture-buffer boundary mismatch stays archived FAIL.
          python3 benchmarks/coverage/texture-buffer/run.py --config /tmp/v109-mesa.json --output reports/v110-texture-buffer-mesa.json
          # Mesa fetch runtime crashes remain archived FAIL, not a waived runtime pass.
          python3 benchmarks/coverage/framebuffer-fetch/suite.py --config /tmp/v109-angle.json --output reports/v110-fetch-angle.json
          python3 benchmarks/coverage/state-machine/run.py --output reports/v110-state-interactions.json
      - name: v1.1.0 frozen evaluation and review-only governance
        run: |
          python3 benchmarks/agent/final-eval/evaluate.py validate
          python3 tools/coverage/lifecycle.py --ledger docs/v1.1.0/source-ledger.json --date 2026-11-15 --output reports/v110-lifecycle.json
          python3 tools/coverage/change_impact.py --root . --date 2026-11-15 --output reports/v110-change-impact.json
          python3 tools/coverage/platform_preflight.py --output reports/v110-platform-preflight.json
          python3 tools/coverage/run_regression.py --output reports/v110-unit-manifest.json
      - name: Preserve v108 results and failure evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: gles-v108-host-reports
          path: reports/
          if-no-files-found: warn
